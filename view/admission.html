<!-- Cabecera y Botón Nuevo Envío Compactos -->
<div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-4 flex justify-between items-center">
  <div>
    <h2 class="text-lg font-bold text-slate-800">Módulo de Ingreso de Envíos</h2>
    <p class="text-xs text-slate-500">Gestión de admisiones y generación de guías</p>
  </div>
  <button onclick="abrirModalEnvio()"
    class="px-4 py-2 bg-blue-600 text-white font-medium text-xs rounded-lg hover:bg-blue-700 transition shadow-sm flex items-center gap-2">
    <i data-lucide="plus" class="w-4 h-4"></i> Nuevo Envío
  </button>
</div>

<!-- Tabla de Envíos del día -->
<div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
  <!-- Cabecera con Título, Filtro y Botón -->
  <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-3 mb-3">
    <h3 class="text-sm font-bold text-slate-700 flex items-center gap-1.5">
      <i data-lucide="calendar" class="w-4 h-4 text-blue-600"></i> Listado de Envíos
    </h3>

    <div
      class="flex flex-wrap items-center gap-3 w-full md:w-auto bg-slate-50 p-2.5 rounded-xl border border-slate-200">

      <!-- 1. MODO 1: GENERAR BARRAS (Automático, no necesita tipo ni guía) -->
      <div class="flex items-center gap-2 pr-2">
        <label class="flex items-center gap-1.5 cursor-pointer text-xs font-medium text-slate-700">
          <input type="radio" name="modo_operacion" id="radio-generar-barras" value="barras" checked
            onchange="cambiarModoOperacion()">
          <span>Generar Barras (13 Dig.)</span>
        </label>
        <button onclick="generarCodigosBarras()" id="btn-generar-barras"
          class="px-3 py-2 bg-blue-600 text-white text-xs font-medium rounded-lg hover:bg-blue-700 transition flex items-center gap-1.5 shadow-sm">
          <i data-lucide="barcode" class="w-3.5 h-3.5"></i> Generar
        </button>
      </div>

      <!-- 2. MODO 2: EXPORTAR EXCEL (Requiere Tipo de Servicio y Guía SIM) -->
      <div class="flex items-center gap-2 border-l pl-3 border-slate-300">
        <label class="flex items-center gap-1.5 cursor-pointer text-xs font-medium text-slate-700">
          <input type="radio" name="modo_operacion" id="radio-exportar-excel" value="excel"
            onchange="cambiarModoOperacion()">
          <span>Exportar Excel</span>
        </label>

        <!-- Selector de Tipo de Servicio (Ancho optimizado y compacto) -->
        <fieldset id="fieldset-tipo-servicio"
          class="border border-slate-300 rounded-xl px-2 pb-1 pt-0 bg-slate-100 opacity-60 w-28 transition-all">
          <legend class="text-[10px] font-semibold text-slate-600 px-1">Tipo Servicio</legend>
          <select id="input-tipo-servicio-exportar" disabled required
            class="select-tipo-servicio w-full bg-transparent text-xs text-slate-800 py-1 focus:outline-none disabled:cursor-not-allowed">
            <option value="">Seleccione...</option>
          </select>
        </fieldset>

        <!-- Guía Sim (Ancho optimizado y compacto) -->
        <fieldset id="fieldset-guia"
          class="border border-slate-300 rounded-xl px-2 pb-1 pt-0 bg-slate-100 opacity-60 w-28 transition-all">
          <legend class="text-[10px] font-semibold text-slate-600 px-1">N° Guía Sim</legend>
          <input type="text" id="input-sim" disabled placeholder="N° GUÍA" autocomplete="off"
            class="w-full bg-transparent text-xs text-slate-800 uppercase py-1 focus:outline-none disabled:cursor-not-allowed">
        </fieldset>

        <button onclick="exportarYActualizarGuiaSim()" id="btn-exportar-excel" disabled
          class="px-3 py-2 bg-emerald-600 text-white text-xs font-medium rounded-lg hover:bg-emerald-700 transition flex items-center gap-1.5 shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
          <i data-lucide="file-spreadsheet" class="w-3.5 h-3.5"></i> Exportar
        </button>
      </div>

    </div>

  </div>

  <!-- Contenedor de la Tabla Grid.js con altura mínima garantizada -->
  <div class="border border-slate-200 rounded-lg overflow-hidden bg-white mt-2 min-h-[200px]">
    <div id="wrapper-gridjs-listado" class="text-xs"></div>
  </div>
</div>


<!-- MODAL AMPLIADO (XXL) CON TABLA DE GESTIÓN INTERNA -->
<div id="modal-envio"
  class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden z-50 flex items-center justify-center p-3 overflow-y-auto">
  <div
    class="bg-white rounded-xl shadow-xl border border-slate-200 w-full max-w-5xl overflow-hidden animate-in fade-in zoom-in duration-200 my-auto">

    <!-- Cabecera del Modal -->
    <div class="px-5 py-3 border-b border-slate-100 flex flex-wrap justify-between items-center bg-slate-50 gap-3">
      <div>
        <h3 class="font-bold text-slate-800 text-sm">Módulo de Ingreso - Gestión de Guía y Envíos</h3>
        <p class="text-[11px] text-slate-500">Agregue los envíos al lote antes de realizar el guardado definitivo</p>
      </div>

      <div class="flex items-center gap-3">
        <!-- Tipo de Guía -->
        <div class="relative w-32 border border-slate-300 rounded-lg px-2.5 pt-3 pb-1 bg-slate-100/60">
          <label class="absolute -top-2 left-2.5 px-1 bg-slate-50 text-[10px] font-semibold text-slate-600">Tipo de
            Guía</label>
          <input type="text" id="modal-tipo-guia" value="ADMISION" disabled
            class="w-full bg-transparent text-xs font-bold text-slate-700 py-1 uppercase text-center focus:outline-none">
        </div>

        <!-- Hoja de Ruta / Valija -->
        <div
          class="relative w-40 border border-slate-300 rounded-lg px-2.5 pt-3 pb-1 bg-white focus-within:border-blue-600 focus-within:ring-1 focus-within:ring-blue-600">
          <label class="absolute -top-2 left-2.5 px-1 bg-white text-[10px] font-semibold text-slate-600">Hoja de Ruta
            *</label>
          <input type="text" id="input-hoja-ruta" placeholder="N° Hoja" autocomplete="off" maxlength="10"
            class="w-full bg-white text-xs text-slate-800 py-1 uppercase focus:outline-none">
        </div>
      </div>
    </div>

    <!-- Cuerpo del Modal -->
    <div class="p-4 space-y-4">

      <form id="form-ingreso-envio" onsubmit="agregarEnvioTemporal(event)"
        class="grid grid-cols-1 md:grid-cols-12 gap-2.5 items-end bg-white p-3 border border-slate-200 rounded-lg">

        <!-- Tipo Servicio -->
        <div class="md:col-span-2">
          <div
            class="relative border border-slate-300 rounded-lg px-2.5 pt-3 pb-1 bg-white focus-within:border-blue-600 focus-within:ring-1 focus-within:ring-blue-600">
            <label class="absolute -top-2 left-2.5 px-1 bg-white text-[10px] font-semibold text-slate-600">Tipo
              Servicio</label>
            <select id="input-tipo-servicio"
              class="select-tipo-servicio w-full bg-white text-xs text-slate-800 py-1 focus:outline-none">
              <option value="">Seleccione...</option>
            </select>
          </div>
        </div>

        <!-- Doc Emitido -->
        <div class="md:col-span-2">
          <div
            class="relative border border-slate-300 rounded-lg px-2.5 pt-3 pb-1 bg-white focus-within:border-blue-600 focus-within:ring-1 focus-within:ring-blue-600">
            <label class="absolute -top-2 left-2.5 px-1 bg-white text-[10px] font-semibold text-slate-600">Doc
              Emitido</label>
            <input type="text" id="input-documento" placeholder="N° Doc" autocomplete="off" maxlength="30"
              class="w-full bg-white text-xs text-slate-800 uppercase py-1 focus:outline-none">
          </div>
        </div>

        <!-- Destinatario -->
        <div class="md:col-span-4">
          <div
            class="relative border border-slate-300 rounded-lg px-2.5 pt-3 pb-1 bg-white focus-within:border-blue-600 focus-within:ring-1 focus-within:ring-blue-600">
            <label
              class="absolute -top-2 left-2.5 px-1 bg-white text-[10px] font-semibold text-slate-600">Destinatario</label>
            <input type="text" id="input-destinatario" placeholder="Nombres y Apellidos" autocomplete="off" maxlength="50"
              class="w-full bg-white text-xs text-slate-800 uppercase py-1 focus:outline-none">
          </div>
        </div>

        <!-- Dirección -->
        <div class="md:col-span-4">
          <div
            class="relative border border-slate-300 rounded-lg px-2.5 pt-3 pb-1 bg-white focus-within:border-blue-600 focus-within:ring-1 focus-within:ring-blue-600">
            <label
              class="absolute -top-2 left-2.5 px-1 bg-white text-[10px] font-semibold text-slate-600">Dirección</label>
            <input type="text" id="input-direccion" placeholder="Av. / Calle / Jr. / Urb." autocomplete="off" maxlength="100"
              class="w-full bg-white text-xs text-slate-800 uppercase py-1 focus:outline-none">
          </div>
        </div>

        <!-- Departamento -->
        <div class="md:col-span-3">
          <div
            class="relative border border-slate-300 rounded-lg px-2.5 pt-3 pb-1 bg-white focus-within:border-blue-600 focus-within:ring-1 focus-within:ring-blue-600">
            <label
              class="absolute -top-2 left-2.5 px-1 bg-white text-[10px] font-semibold text-slate-600">Departamento</label>
            <select id="input-departamento" onchange="cargarProvincias()"
              class="w-full bg-white text-xs text-slate-800 uppercase py-1 focus:outline-none">
              <option value="">Seleccione...</option>
            </select>
          </div>
        </div>

        <!-- Provincia -->
        <div class="md:col-span-3">
          <div
            class="relative border border-slate-300 rounded-lg px-2.5 pt-3 pb-1 bg-white focus-within:border-blue-600 focus-within:ring-1 focus-within:ring-blue-600">
            <label
              class="absolute -top-2 left-2.5 px-1 bg-white text-[10px] font-semibold text-slate-600">Provincia</label>
            <select id="input-provincia" onchange="cargarDistritos()" disabled
              class="w-full bg-white text-xs text-slate-800 uppercase py-1 focus:outline-none disabled:opacity-50">
              <option value="">Seleccione...</option>
            </select>
          </div>
        </div>

        <!-- Distrito (Ubigeo ID) -->
        <div class="md:col-span-3">
          <div
            class="relative border border-slate-300 rounded-lg px-2.5 pt-3 pb-1 bg-white focus-within:border-blue-600 focus-within:ring-1 focus-within:ring-blue-600">
            <label class="absolute -top-2 left-2.5 px-1 bg-white text-[10px] font-semibold text-slate-600">Distrito
              (Ubigeo)</label>
            <select id="input-distrito" disabled
              class="w-full bg-white text-xs text-slate-800 uppercase py-1 focus:outline-none disabled:opacity-50">
              <option value="">Seleccione...</option>
            </select>
          </div>
        </div>

        <!-- Peso -->
        <div class="md:col-span-3">
          <div
            class="relative border border-slate-300 rounded-lg px-2.5 pt-3 pb-1 bg-white focus-within:border-blue-600 focus-within:ring-1 focus-within:ring-blue-600">
            <label class="absolute -top-2 left-2.5 px-1 bg-white text-[10px] font-semibold text-slate-600">Peso
              (gr)</label>
            <input type="number" id="input-peso" min="0" step="1" placeholder="Ej. 500" autocomplete="off" maxlength="5"
              class="w-full bg-white text-xs text-slate-800 py-1 focus:outline-none">
          </div>
        </div>

        <!-- Fila inferior: Contadores y Botón -->
        <div
          class="md:col-span-12 flex flex-wrap justify-between items-center pt-2 border-t border-slate-100 mt-1 gap-2">
          <div class="flex items-center gap-4">
            <div class="flex items-center gap-1.5">
              <span class="text-[11px] font-semibold text-slate-600">Total Envíos:</span>
              <input type="text" id="modal-total-envios" value="0" disabled
                class="w-14 bg-slate-200/60 text-xs font-bold text-slate-700 px-2 py-1 rounded-lg text-center">
            </div>
            <div class="flex items-center gap-1.5">
              <span class="text-[11px] font-semibold text-slate-600">Sen:</span>
              <input type="text" id="modal-total-envios-sen" value="0" disabled
                class="w-14 bg-slate-200/60 text-xs font-bold text-blue-600 px-2 py-1 rounded-lg text-center">
            </div>
            <div class="flex items-center gap-1.5">
              <span class="text-[11px] font-semibold text-slate-600">Sel:</span>
              <input type="text" id="modal-total-envios-sel" value="0" disabled
                class="w-14 bg-slate-200/60 text-xs font-bold text-emerald-600 px-2 py-1 rounded-lg text-center">
            </div>
          </div>

          <button type="submit"
            class="px-4 py-1.5 bg-blue-600 text-white text-xs font-medium rounded-lg hover:bg-blue-700 transition shadow-sm flex items-center gap-1.5">
            <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i> Agregar a la Lista
          </button>
        </div>
      </form>

      <!-- Tabla Interna con Scroll Vertical (Sin Paginación) -->
      <div class="border border-slate-200 rounded-lg overflow-hidden bg-white mt-3">
        <div class="max-h-56 overflow-y-auto">
          <div id="wrapper-gridjs-envios" class="text-xs"></div>
        </div>
      </div>

    </div>

    <!-- Pie del Modal: Botón Final de Guardado -->
    <div class="px-5 py-3 border-t border-slate-100 flex justify-between items-center bg-slate-50">
      <button type="button" onclick="cerrarModalEnvio()"
        class="px-4 py-2 bg-slate-200 text-slate-700 text-xs font-medium rounded-lg hover:bg-slate-300 transition">Cancelar</button>
      <button type="button" onclick="guardarGuiaYDocumentosDefinitivo()"
        class="px-5 py-2 bg-emerald-600 text-white text-xs font-semibold rounded-lg hover:bg-emerald-700 transition shadow-sm flex items-center gap-2">
        <i data-lucide="save" class="w-4 h-4"></i> Guardar Guía y Envíos (Definitivo)
      </button>
    </div>

  </div>
</div>
