<!-- Contenedor Maestro del Dashboard con Paleta Clara -->
<div class="flex h-screen w-screen overflow-hidden bg-slate-100 font-sans">

  <!-- 1. BARRA LATERAL (Aside más angosto y estilizado) -->
  <aside id="app-aside"
    class="w-56 h-screen bg-white text-slate-700 flex flex-col border-r border-slate-200 shadow-sm flex-shrink-0 transition-all duration-300">

    <!-- Cabecera del Aside -->
    <div class="p-2 flex flex-col items-center text-center border-b border-slate-100">
      <div class="w-full flex items-center justify-between">
        <div class="aside-text flex-1 flex justify-center">
          <img src="resources/images.png" alt="Logo Serpost" class="w-28 h-auto object-contain">
        </div>
        <button onclick="toggleSidebar()"
          class="p-1 rounded-lg text-slate-500 hover:bg-slate-100 hover:text-slate-800 transition mx-auto flex-shrink-0">
          <i data-lucide="menu" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Texto inferior del logo -->
      <div id="aside-header-content" class="aside-text w-full -mt-0.5">
        <span class="text-slate-800 font-bold text-xs tracking-wide">Servicios postales del Peru</span>
      </div>
    </div>

    <!-- Navegación del Menú -->
    <nav class="flex-grow p-4 space-y-2 overflow-y-auto overflow-x-hidden">

      <!-- Home -->
      <a href="#" onclick="cargarSeccion('home', this)" title="Home"
        class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-100 transition group">
        <i data-lucide="home" class="w-5 h-5 text-slate-500 group-hover:text-slate-800 transition flex-shrink-0"></i>
        <span class="aside-text text-sm font-medium">Home</span>
      </a>

      <!-- Menú Desplegable: Envíos -->
      <div>
        <button onclick="toggleSubmenu('submenu-envios', 'arrow-envios')"
          class="w-full relative flex items-center justify-between px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-100 transition group">

          <div class="flex items-center gap-3">
            <div class="relative">
              <i data-lucide="package"
                class="w-5 h-5 text-slate-500 group-hover:text-slate-800 transition flex-shrink-0"></i>
              <!-- Indicador visual cuando el aside es w-20 -->
              <span
                class="submenu-indicator hidden absolute -bottom-1 -right-1 w-2 h-2 bg-blue-600 rounded-full border border-white"></span>
            </div>
            <span class="aside-text text-sm font-medium">Envíos</span>
          </div>

          <!-- Flecha indicadora -->
          <i id="arrow-envios" data-lucide="chevron-down"
            class="aside-text w-4 h-4 text-slate-400 transition-transform duration-200 flex-shrink-0"></i>
        </button>

        <!-- Submenú -->
        <div id="submenu-envios" class="hidden space-y-1 pl-2 mt-1">
          <a href="#" onclick="cargarSeccion('admision', this)" title="Nuevos Envios"
            class="nav-item flex items-center gap-3 px-3 py-2 rounded-lg text-slate-600 hover:bg-slate-100 transition group">
            <i data-lucide="file-plus"
              class="w-4 h-4 text-slate-500 group-hover:text-blue-800 transition flex-shrink-0"></i>
            <span class="aside-text text-sm">Nuevos Envios</span>
          </a>
          <a href="#" onclick="cargarSeccion('envios', this)" title="envios"
            class="nav-item flex items-center gap-3 px-3 py-2 rounded-lg text-slate-600 hover:bg-slate-100 transition group">
            <i data-lucide="file-text"
              class="w-4 h-4 text-slate-500 group-hover:text-blue-800 transition flex-shrink-0"></i>
            <span class="aside-text text-sm">Envios</span>
          </a>
          <a href="#" onclick="cargarSeccion('guias', this)" title="guias"
            class="nav-item flex items-center gap-3 px-3 py-2 rounded-lg text-slate-600 hover:bg-slate-100 transition group">
            <i data-lucide="check-circle"
              class="w-4 h-4 text-slate-500 group-hover:text-blue-800 transition flex-shrink-0"></i>
            <span class="aside-text text-sm">Guias</span>
          </a>
          <a href="#" onclick="cargarSeccion('consolidado', this)" title="consolidado"
            class="nav-item flex items-center gap-3 px-3 py-2 rounded-lg text-slate-600 hover:bg-slate-100 transition group">
            <i data-lucide="corner-up-left"
              class="w-4 h-4 text-slate-500 group-hover:text-blue-800 transition flex-shrink-0"></i>
            <span class="aside-text text-sm">Consolidado</span>
          </a>
        </div>
      </div>
    </nav>

    <!-- Sección Usuario y Cerrar Sesión -->
    <div class="p-3 border-t border-slate-100 space-y-2">
      <div class="flex items-center gap-3 px-1 py-1.5 rounded-lg bg-slate-50/80 border border-slate-100">
        <!-- Perfil de Usuario con Texto Ajustable -->
        <div class="flex items-center gap-3 px-2 py-1.5 rounded-lg bg-slate-50/80 border border-slate-100">
          <!-- Avatar -->
          <div
            class="w-9 h-9 rounded-full bg-blue-100 text-blue-800 flex items-center justify-center font-bold text-xs flex-shrink-0 shadow-inner overflow-hidden">
            <img src="resources/avatar.png" alt="Avatar" class="w-full h-full object-cover"
              onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
            <span style="display: none;" class="w-full h-full flex items-center justify-center">YN</span>
          </div>

          <!-- Textos del usuario (Ajustados para permitir doble línea sin cortes) -->
          <div class="aside-text flex-1 min-w-0">
            <p class="text-[10px] text-slate-400 font-medium leading-none">Bienvenido,</p>
            <p id="sesion-user" class="text-[11px] font-bold text-slate-800 uppercase leading-tight mt-1 line-clamp-2">
              Cargando...
            </p>
            <p class="text-[10px] text-slate-400 font-medium leading-none">Sucursal: </p>
            <p id="sesion-sucursal"
              class="text-[11px] font-bold text-slate-800 uppercase leading-tight mt-1 line-clamp-2">
              Cargando...
            </p>
          </div>
        </div>
      </div>

      <button onclick="handleLogout()" title="Cerrar Sesión"
        class="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-red-600 hover:bg-red-50 transition group">
        <i data-lucide="log-out" class="w-5 h-5 flex-shrink-0"></i>
        <span class="aside-text text-sm font-medium">Cerrar Sesión</span>
      </button>
    </div>
  </aside>

  <!-- 2. CONTENEDOR DERECHO -->
  <div class="flex-1 flex flex-col h-screen overflow-hidden">
    <!-- Área Central Dinámica -->
    <main id="app-view" class="flex-grow p-6 overflow-y-auto bg-slate-50">
      <h1 class="text-2xl font-bold text-slate-800 mb-4">Bienvenido al Panel</h1>
      <p class="text-slate-600">Selecciona una opción del menú lateral para comenzar a operar.</p>
    </main>

    <!-- Pie de Página -->
    <footer
      class="h-10 bg-white border-t border-slate-200 flex items-center justify-center px-6 text-xs text-slate-500 flex-shrink-0">
      Administracion postal Cusco - Area Redes © 2026 DataYEH
    </footer>
  </div>
</div>
