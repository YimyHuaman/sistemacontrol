<!-- ========================================== -->
<!-- MÓDULO DE GUÍA -->
<!-- ========================================== -->
<div class="flex flex-col h-full w-full gap-2.5 p-2 bg-slate-50 box-border overflow-hidden">

  <!-- BARRA SUPERIOR / HEADER Y SELECTOR DE MODOS -->
  <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 flex-shrink-0">
    
    <!-- Título y subtítulo -->
    <div class="flex items-center gap-2.5">
      <div class="p-1.5 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center">
        <i data-lucide="book-open" class="w-4 h-4"></i>
      </div>
      <div>
        <h2 class="text-sm md:text-base font-extrabold text-slate-900 tracking-tight">Módulo de Guía</h2>
        <p class="text-[11px] text-slate-500">Gestión de Admisión y devolución de guías</p>
      </div>
    </div>

    <!-- CONTENEDOR ÚNICO INTEGRADO (Radio Tabs) -->
    <div class="flex items-center gap-1 bg-slate-100 p-1 rounded-xl border border-slate-200 w-full sm:w-auto">
      
      <!-- Radio: Guía Admisión (Marcado por defecto) -->
      <label class="flex-1 sm:flex-initial flex items-center justify-center gap-1.5 cursor-pointer text-xs font-semibold text-slate-700 px-3 py-1.5 rounded-lg transition hover:text-blue-600 has-[:checked]:bg-white has-[:checked]:text-blue-600 has-[:checked]:shadow-sm">
        <input type="radio" name="modo-guia" id="radio-admision" value="admision" checked class="sr-only">
        <i data-lucide="file-text" class="w-3.5 h-3.5"></i>
        <span>Guía Admisión</span>
      </label>

      <!-- Radio: Devolución -->
      <label class="flex-1 sm:flex-initial flex items-center justify-center gap-1.5 cursor-pointer text-xs font-semibold text-slate-700 px-3 py-1.5 rounded-lg transition hover:text-blue-600 has-[:checked]:bg-white has-[:checked]:text-blue-600 has-[:checked]:shadow-sm">
        <input type="radio" name="modo-guia" id="radio-devolucion" value="devolucion" class="sr-only">
        <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
        <span>Devolución</span>
      </label>

    </div>

  </div>

  <!-- CONTENEDOR DE LA TABLA / GRID (Se ajusta al espacio restante y tiene scroll interno) -->
  <div class="flex-1 flex flex-col border border-slate-200 rounded-2xl overflow-hidden bg-white shadow-sm min-h-0">
    <div id="wrapper-grid-table-guias" class="flex-1 w-full h-full text-xs overflow-auto">
      <!-- Contenido de la tabla / grid -->
      <div class="flex items-center justify-center h-full text-slate-400 min-h-[250px]">
        <div class="text-center flex flex-col items-center gap-1.5">
            <i data-lucide="table" class="w-8 h-8 stroke-1 text-slate-300"></i>
            <span class="text-[11px]">Cargando registros de guías...</span>
        </div>
      </div>
    </div>
  </div>

</div>
