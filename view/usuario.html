<!-- ========================================== -->
<!-- 1. MÓDULO PRINCIPAL DE USUARIOS -->
<!-- ========================================== -->
<div
    class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 mb-4 flex items-center justify-between gap-3 flex-wrap">
    <!-- Título y subtítulo -->
    <div class="flex-shrink-0">
        <h2 class="text-base font-bold text-slate-800">Módulo de Usuarios</h2>
        <p class="text-[11px] text-slate-500">Gestión de usuarios del sistema</p>
    </div>

    <!-- Botones de Acción Principales -->
    <div class="flex items-center gap-2 flex-shrink-0">
        <button onclick="abrirModalUsuario()" id="btn-nuevo-usuario"
            class="px-3 py-1.5 bg-blue-600 text-white font-medium text-xs rounded-lg hover:bg-blue-700 transition shadow-sm flex items-center gap-1.5">
            <i data-lucide="plus" class="w-3.5 h-3.5"></i> Nuevo Usuario
        </button>
    </div>
</div>

<!-- Contenedor de la Tabla o Grid de Resultados -->
<div class="border border-slate-200 rounded-lg overflow-hidden bg-white mt-2 min-h-[200px]">
    <div id="wrapper-grid-table-usuarios" class="text-xs"></div>
</div>

<!-- ========================================== -->
<!-- MODAL: GESTIÓN DE USUARIO -->
<!-- ========================================== -->
<div id="modalUsuario" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm hidden">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-lg mx-4 overflow-hidden transform transition-all">

        <!-- Encabezado del Modal -->
        <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100">
            <h3 id="tituloModalUsuario" class="text-lg font-semibold text-slate-800">Registrar Nuevo Usuario</h3>
            <button onclick="cerrarModalUsuario()" class="text-slate-400 hover:text-slate-600 transition">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>

        <!-- Formulario -->
        <form id="formUsuario" onsubmit="guardarUsuario(event)" class="p-6 space-y-4">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Input Usuario -->
                <div>
                    <div
                        class="relative border border-slate-300 rounded-lg px-2.5 pt-3 pb-1 bg-white focus-within:border-blue-600 focus-within:ring-1 focus-within:ring-blue-600">
                        <label
                            class="absolute -top-2 left-2.5 px-1 bg-white text-[10px] font-semibold text-slate-600">Usuario</label>
                        <input type="text" id="input-usuario" placeholder="Ej. YHUAMANQ" autocomplete="off"
                            maxlength="50" required
                            class="w-full bg-white text-xs text-slate-800 uppercase py-1 focus:outline-none">
                    </div>
                </div>

                <!-- Input Contraseña con Botón de Ojo -->
                <div>
                    <div
                        class="relative border border-slate-300 rounded-lg px-2.5 pt-3 pb-1 bg-white focus-within:border-blue-600 focus-within:ring-1 focus-within:ring-blue-600">
                        <label
                            class="absolute -top-2 left-2.5 px-1 bg-white text-[10px] font-semibold text-slate-600">Contraseña</label>
                        <div class="flex items-center">
                            <input type="password" id="input-contrasena" placeholder="••••••••" autocomplete="off"
                                maxlength="50" required
                                class="w-full bg-white text-xs text-slate-800 py-1 focus:outline-none">
                            <button type="button"
                                onclick="togglePassword('input-contrasena', 'icono-ojo-password')"
                                class="text-slate-400 hover:text-slate-600 px-1 focus:outline-none"
                                title="Ver contraseña">
                                <i data-lucide="eye" id="icono-ojo-password" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Buscador de Colaborador -->
            <div>
                <div
                    class="relative border border-slate-300 rounded-lg px-2.5 pt-3 pb-1 bg-white focus-within:border-blue-600">
                    <label
                        class="absolute -top-2 left-2.5 px-1 bg-white text-[10px] font-semibold text-slate-600">Colaborador</label>
                    <div class="flex items-center gap-2">
                        <input type="hidden" id="input-id-colaborador" required>
                        <input type="text" id="input-nombre-colaborador" placeholder="Seleccione un colaborador..."
                            readonly
                            class="w-full bg-white text-xs text-slate-800 py-1 focus:outline-none cursor-pointer"
                            onclick="abrirModalBusquedaColaborador()">
                        <button type="button" onclick="abrirModalBusquedaColaborador()"
                            class="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-md text-xs font-medium transition flex items-center gap-1">
                            <i data-lucide="search" class="w-3.5 h-3.5"></i> Buscar
                        </button>
                    </div>
                </div>
            </div>

            <!-- Buscador de Sucursal -->
            <div>
                <div
                    class="relative border border-slate-300 rounded-lg px-2.5 pt-3 pb-1 bg-white focus-within:border-blue-600">
                    <label
                        class="absolute -top-2 left-2.5 px-1 bg-white text-[10px] font-semibold text-slate-600">Sucursal</label>
                    <div class="flex items-center gap-2">
                        <input type="hidden" id="input-id-sucursal" required>
                        <input type="text" id="input-nombre-sucursal" placeholder="Seleccione una sucursal..." readonly
                            class="w-full bg-white text-xs text-slate-800 py-1 focus:outline-none cursor-pointer"
                            onclick="abrirModalBusquedaSucursal()">
                        <button type="button" onclick="abrirModalBusquedaSucursal()"
                            class="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-md text-xs font-medium transition flex items-center gap-1">
                            <i data-lucide="search" class="w-3.5 h-3.5"></i> Buscar
                        </button>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Select Perfil -->
                <div>
                    <div
                        class="relative border border-slate-300 rounded-lg px-2.5 pt-3 pb-1 bg-white focus-within:border-blue-600">
                        <label
                            class="absolute -top-2 left-2.5 px-1 bg-white text-[10px] font-semibold text-slate-600">Perfil</label>
                        <select id="input-perfil" required
                            class="w-full bg-white text-xs text-slate-800 uppercase py-1 focus:outline-none">
                            <option value="">Seleccione...</option>
                            <option value="ADMIN">ADMIN</option>
                            <option value="OPERADOR">OPERADOR</option>
                        </select>
                    </div>
                </div>

                <!-- Checkbox Estado -->
                <div class="flex items-center h-full pt-3">
                    <label class="relative flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="input-estado" checked
                            class="w-4 h-4 text-blue-600 border-slate-300 rounded focus:ring-blue-500">
                        <span class="text-xs font-semibold text-slate-700">Estado Activo</span>
                    </label>
                </div>
            </div>

            <!-- Botones de Acción -->
            <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-100">
                <button type="button" onclick="cerrarModalUsuario()"
                    class="px-4 py-2 border border-slate-300 rounded-lg text-sm font-medium text-slate-700 hover:bg-slate-50 transition">
                    Cancelar
                </button>
                <button type="submit" id="btnAccionUsuario"
                    class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium transition shadow-sm">
                    Guardar Usuario
                </button>
            </div>

        </form>
    </div>
</div>

<!-- ========================================== -->
<!-- MODAL AUXILIAR: BUSCAR COLABORADOR -->
<!-- ========================================== -->
<div id="modalBuscarColaborador"
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm hidden">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-md mx-4 overflow-hidden transform transition-all">
        <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100">
            <h3 class="text-lg font-semibold text-slate-800">Seleccionar Colaborador</h3>
            <button onclick="cerrarModalBusquedaColaborador()" class="text-slate-400 hover:text-slate-600 transition">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>
        <div class="p-6">
            <div id="wrapper-grid-buscar-colaborador" class="text-xs min-h-[150px]"></div>
        </div>
    </div>
</div>

<!-- ========================================== -->
<!-- MODAL AUXILIAR: BUSCAR SUCURSAL -->
<!-- ========================================== -->
<div id="modalBuscarSucursal"
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm hidden">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-md mx-4 overflow-hidden transform transition-all">
        <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100">
            <h3 class="text-lg font-semibold text-slate-800">Seleccionar Sucursal</h3>
            <button onclick="cerrarModalBusquedaSucursal()" class="text-slate-400 hover:text-slate-600 transition">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>
        <div class="p-6">
            <div id="wrapper-grid-buscar-sucursal" class="text-xs min-h-[150px]"></div>
        </div>
    </div>
</div>

<!-- ========================================== -->
<!-- MODAL: CAMBIAR CONTRASEÑA -->
<!-- ========================================== -->
<div id="modalCambiarPassword"
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm hidden">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-sm mx-4 overflow-hidden transform transition-all">

        <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100">
            <h3 class="text-lg font-semibold text-slate-800">Cambiar Contraseña</h3>
            <button onclick="cerrarModalCambiarPassword()" class="text-slate-400 hover:text-slate-600 transition">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>

        <form id="formCambiarPassword" onsubmit="guardarNuevaPassword(event)" class="p-6 space-y-4">
            <p class="text-xs text-slate-500">Usuario: <span id="label-usuario-pass"
                    class="font-bold text-slate-700"></span></p>

            <div>
                <div
                    class="relative flex items-center border border-slate-300 rounded-lg px-2.5 pt-3 pb-1 bg-white focus-within:border-blue-600">
                    <label class="absolute -top-2 left-2.5 px-1 bg-white text-[10px] font-semibold text-slate-600">Nueva
                        Contraseña</label>
                    <input type="password" id="input-nueva-contrasena" placeholder="••••••••" autocomplete="off"
                        required class="w-full bg-white text-xs text-slate-800 py-1 focus:outline-none">

                    <!-- Botón del ojito reutilizando la lógica -->
                    <button type="button" onclick="togglePassword('input-nueva-contrasena', 'icono-ojo-password-nueva')"
                        class="text-slate-400 hover:text-slate-600 focus:outline-none p-1 ml-1">
                        <i id="icono-ojo-password-nueva" data-lucide="eye" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-100">
                <button type="button" onclick="cerrarModalCambiarPassword()"
                    class="px-4 py-2 border border-slate-300 rounded-lg text-sm font-medium text-slate-700 hover:bg-slate-50 transition">
                    Cancelar
                </button>
                <button type="submit"
                    class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium transition shadow-sm">
                    Actualizar Clave
                </button>
            </div>
        </form>

    </div>
</div>
