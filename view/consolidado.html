<!-- ========================================== -->
<!-- 1. MÓDULO PRINCIPAL DE CONSOLIDADO -->
<!-- ========================================== -->
<div class="flex flex-col h-full w-full gap-2.5 p-2 bg-slate-50 box-border overflow-hidden">

  <!-- BARRA SUPERIOR / HEADER Y FILTROS -->
  <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 flex flex-col gap-2.5 flex-shrink-0">

    <!-- FILA SUPERIOR: Título y Botón Exportar -->
    <div
      class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2 pb-2 border-b border-slate-100">

      <!-- Título y subtítulo -->
      <div class="flex items-center gap-2.5">
        <div class="p-1.5 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center">
          <i data-lucide="layers-3" class="w-4 h-4"></i>
        </div>
        <div>
          <h2 class="text-sm md:text-base font-extrabold text-slate-900 tracking-tight">Módulo de Consolidado</h2>
          <p class="text-[11px] text-slate-500">Visualización y gestión integral de envíos</p>
        </div>
      </div>

      <!-- Botón de Acción Principal (Exportar Excel) -->
      <button id="btn-exportar-excel" onclick="window.exportarExcelDistribucion()"
        class="px-3 py-1.5 bg-emerald-50 text-emerald-700 font-semibold text-xs rounded-xl hover:bg-emerald-100 border border-emerald-200 transition flex items-center justify-center gap-1.5 shadow-sm flex-shrink-0">
        <i data-lucide="file-spreadsheet" class="w-3.5 h-3.5"></i>
        Exportar a Excel
      </button>

    </div>

    <!-- FILA INFERIOR: Contenedor de Filtros (Estados y Fechas) -->
    <div
      class="flex flex-wrap items-center justify-between gap-2 bg-slate-50 p-2 rounded-xl border border-slate-200/80">

      <!-- Contenedor dinámico de Checkboxes de Estados y Servicios -->
      <div class="flex flex-wrap items-center gap-4 flex-1 min-w-[200px]">

        <!-- Estados -->
        <div class="flex items-center gap-2 flex-wrap">
          <span class="text-[11px] font-semibold text-slate-700 flex items-center gap-1 flex-shrink-0">
            <i data-lucide="filter" class="w-3 h-3 text-slate-500"></i>
            Estados:
          </span>
          <div id="contenedor-checks-estados" class="flex items-center gap-2 flex-wrap">
            <span
              class="text-[11px] text-slate-400 italic bg-white px-1.5 py-0.5 rounded border border-slate-200">Cargando
              estados...</span>
          </div>
        </div>

        <!-- Servicios (ID ajustado a 'contenedor-checks-servicios' para que coincida con la función) -->
        <div class="flex items-center gap-2 flex-wrap">
          <span class="text-[11px] font-semibold text-slate-700 flex items-center gap-1 flex-shrink-0">
            <i data-lucide="filter" class="w-3 h-3 text-slate-500"></i>
            Servicios:
          </span>
          <div id="contenedor-checks-servicios" class="flex items-center gap-2 flex-wrap">
            <span
              class="text-[11px] text-slate-400 italic bg-white px-1.5 py-0.5 rounded border border-slate-200">Cargando
              servicios...</span>
          </div>
        </div>

      </div>

      <!-- Campos de fecha y botón de búsqueda -->
      <div class="flex flex-wrap items-center gap-2 w-full lg:w-auto">

        <!-- Grupo Desde -->
        <div
          class="flex items-center gap-1 bg-white px-2 py-0.5 rounded-lg border border-slate-200 shadow-sm flex-1 sm:flex-initial">
          <span class="text-[10px] font-medium text-slate-500 flex items-center gap-1 flex-shrink-0">
            <i data-lucide="calendar" class="w-3 h-3 text-slate-400"></i>
            Desde:
          </span>
          <input type="date" id="fecha-desde"
            class="bg-transparent text-[11px] text-slate-700 focus:outline-none w-full sm:w-24 cursor-pointer">
        </div>

        <!-- Grupo Hasta -->
        <div
          class="flex items-center gap-1 bg-white px-2 py-0.5 rounded-lg border border-slate-200 shadow-sm flex-1 sm:flex-initial">
          <span class="text-[10px] font-medium text-slate-500 flex items-center gap-1 flex-shrink-0">
            <i data-lucide="calendar" class="w-3 h-3 text-slate-400"></i>
            Hasta:
          </span>
          <input type="date" id="fecha-hasta"
            class="bg-transparent text-[11px] text-slate-700 focus:outline-none w-full sm:w-24 cursor-pointer">
        </div>

        <!-- Botón de Búsqueda -->
        <button id="btn-buscar-fechas"
          class="px-3 py-1 bg-blue-600 text-white text-[11px] font-semibold rounded-lg hover:bg-blue-700 active:scale-95 transition flex items-center justify-center gap-1 shadow-sm shadow-blue-500/20 w-full sm:w-auto flex-shrink-0">
          <i data-lucide="search" class="w-3 h-3"></i>
          Buscar
        </button>

      </div>

    </div>

  </div>

  <!-- CONTENEDOR DE LA TABLA / GRID (Se ajusta al espacio restante sin desbordar) -->
  <div class="flex-1 flex flex-col border border-slate-200 rounded-2xl overflow-hidden bg-white shadow-sm min-h-0">
    <div id="wrapper-grid-table-consolidado" class="flex-1 w-full h-full text-xs overflow-auto">
      <!-- Contenido de la tabla / grid -->
      <div class="flex items-center justify-center h-full text-slate-400 min-h-[200px]">
        <div class="text-center flex flex-col items-center gap-1.5">
          <i data-lucide="table" class="w-8 h-8 stroke-1 text-slate-300"></i>
          <span class="text-[11px]">Seleccione filtros y haga clic en buscar para ver los datos</span>
        </div>
      </div>
    </div>
  </div>

</div>
