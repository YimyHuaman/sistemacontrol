<div class="w-full max-w-[340px] p-5 bg-white/90 backdrop-blur-md rounded-2xl shadow-xl border border-slate-100">
  <!-- Título del Formulario -->
  <div class="text-center mb-5">
    <div class="w-full px-2 mb-4 flex items-center justify-center">
      <img src="resources/images.png" alt="Logo Serpost" class="w-48 h-auto object-contain">
    </div>
    <h2 class="text-lg font-bold tracking-tight text-slate-900">Control de Envíos</h2>
    <p class="text-[11px] text-slate-400 font-medium">Ingrese sus credenciales para acceder</p>
  </div>

  <!-- Formulario de Acceso -->
  <form id="login-form" onsubmit="handleLogin(event)" class="space-y-3.5">
    <div class="space-y-3">
      <!-- Campo Usuario -->
      <fieldset
        class="border border-slate-300 rounded-xl px-3 pb-1.5 pt-0 bg-white focus-within:border-blue-600 transition-all">
        <legend class="text-[10px] font-bold uppercase tracking-wider text-slate-500 px-1">Usuario</legend>
        <input type="text" id="username" required placeholder="INGRESE SU USUARIO" autocomplete="off"
          class="w-full bg-transparent text-xs font-medium text-slate-800 uppercase py-1.5 focus:outline-none">
      </fieldset>

      <!-- Campo Contraseña -->
      <fieldset
        class="border border-slate-300 rounded-xl px-3 pb-1.5 pt-0 bg-white focus-within:border-blue-600 transition-all">
        <legend class="text-[10px] font-bold uppercase tracking-wider text-slate-500 px-1">Contraseña</legend>
        <div class="relative flex items-center">
          <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password"
            class="w-full bg-transparent text-xs text-slate-800 py-1.5 pr-8 focus:outline-none">

          <!-- Botón del Ojo con Lucide -->
          <button type="button" onclick="togglePassword('password', 'eye-icon')"
            class="absolute right-0 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none transition-colors">
            <i data-lucide="eye" id="eye-icon" class="w-4 h-4"></i>
          </button>
        </div>
      </fieldset>
    </div>

    <!-- Mensaje de Error (Oculto por defecto) -->
    <div id="login-error"
      class="hidden text-[11px] text-red-600 font-medium text-center bg-red-50/80 py-2 px-3 rounded-xl border border-red-100">
      Credenciales incorrectas. Intente nuevamente.
    </div>

    <!-- Botón de Ingreso -->
    <button type="submit"
      class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white font-semibold rounded-xl shadow-md shadow-blue-600/20 transition-all duration-200 text-xs mt-1">
      Iniciar Sesión
    </button>
  </form>
</div>
